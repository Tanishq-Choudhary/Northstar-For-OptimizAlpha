services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: northstar_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar_local_dev}
      POSTGRES_DB: northstar
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - northstar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar_admin -d northstar"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      ADMIN_DATABASE_URL: postgres://northstar_admin:${POSTGRES_PASSWORD:-northstar_local_dev}@db:5432/northstar
      APP_DATABASE_URL: postgres://northstar_app:${APP_DB_PASSWORD:-northstar_app_local_dev}@db:5432/northstar
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-northstar_app_local_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_only_insecure_secret_change_before_deploying}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      KEEPALIVE_URL: ${KEEPALIVE_URL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  northstar_pgdata: